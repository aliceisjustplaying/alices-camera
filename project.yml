name: AlicesCamera
options:
  deploymentTarget:
    iOS: '27.1'
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.aliceisjustplaying.camera
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: A3F67DDZAJ
targets:
  AlicesCamera:
    type: application
    platform: iOS
    sources: [Camera, Shared, Assets.xcassets]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: CameraCapture
      - target: CameraControls
    info:
      path: Camera/Info.plist
      properties:
        CFBundleDisplayName: "Alice's Camera"
        CFBundleShortVersionString: '1.0'
        CFBundleVersion: '1'
        NSCameraUsageDescription: "Alice's Camera uses the camera to take photos."
        NSPhotoLibraryAddUsageDescription: "Alice's Camera saves your photos to your library."
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  CameraCapture:
    type: extensionkit-extension
    platform: iOS
    sources:
      - path: Camera
        excludes: [AlicesCameraApp.swift, Info.plist]
      - Capture
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aliceisjustplaying.camera.capture
    info:
      path: Capture/Info.plist
      properties:
        CFBundleDisplayName: "Alice's Camera"
        CFBundleShortVersionString: '1.0'
        CFBundleVersion: '1'
        NSCameraUsageDescription: "Alice's Camera uses the camera to take photos."
        NSPhotoLibraryAddUsageDescription: "Alice's Camera saves your photos to your library."
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.securecapture
  CameraControls:
    type: app-extension
    platform: iOS
    sources: [Controls, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aliceisjustplaying.camera.controls
    info:
      path: Controls/Info.plist
      properties:
        CFBundleDisplayName: "Alice's Camera"
        CFBundleShortVersionString: '1.0'
        CFBundleVersion: '1'
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
